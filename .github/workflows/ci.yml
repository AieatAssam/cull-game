name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - name: M5 generator and bot balance report (non-blocking while gates are red)
        run: npm run validate:m5
        continue-on-error: true
      - name: M6 full Shoot bot duration report (non-blocking while the AdaptiveBot gate is red)
        run: npm run validate:m6
        continue-on-error: true
      - run: npm run test:e2e
